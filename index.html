
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <div class="icon">🎂</div>

        <h1>Age Calculator</h1>
        <p class="subtitle">Discover your age in years, months & days!</p>

        <label for="dob">Enter Your Date of Birth</label>
        <input type="date" id="dob">

        <button id="calculateBtn">Calculate My Age</button>

        <p id="error" class="error" role="alert"></p>

        <div id="result" class="result" aria-live="polite" hidden>
            <h2>Your Age Is</h2>

            <div class="age-boxes">
                <div class="age-box">
                    <span id="years">0</span>
                    <p>Years</p>
                </div>

                <div class="age-box">
                    <span id="months">0</span>
                    <p>Months</p>
                </div>

                <div class="age-box">
                    <span id="days">0</span>
                    <p>Days</p>
                </div>
            </div>

            <p id="birthdayMessage" class="birthday-message"></p>
        </div>

        <p class="footer">Made with ❤️ for you</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
